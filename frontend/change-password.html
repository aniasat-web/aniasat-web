<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/header-theme.css" />
    <style>
      :root {
        --bg: #faf8f5;
        --ink: #292524;
        --muted: #78716c;
        --border: #e7e5e4;
        --primary: #b45309;
        --primary-hover: #92400e;
        --surface: #fffefb;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: radial-gradient(circle at top right, #fef3c7 0%, var(--bg) 45%);
        color: var(--ink);
        min-height: 100vh;
        padding-top: 70px;
      }

      h1, .navbar-brand {
        font-family: "Instrument Serif", serif;
      }

      .shell {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
      }

      .card-shell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(41, 37, 36, 0.08);
      }

      .btn-primary {
        background-color: var(--primary);
        border-color: var(--primary);
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
      }
    </style>
    <link rel="stylesheet" href="assets/ui-theme.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img class="brand-logo" src="assets/blossom-mark.png" alt="Blossom logo" />
          <span>Blossom Foundation</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fw-semibold small text-uppercase">
            <li class="nav-item">
              <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a>
            </li>
            <li class="nav-item d-flex align-items-center">
              <span class="nav-link text-muted d-none" id="authUserLabel"></span>
            </li>
            <li class="nav-item d-flex align-items-center ms-lg-2">
              <button class="btn btn-sm btn-outline-secondary d-none" id="logoutBtn" type="button">Logout</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="shell">
        <section class="card-shell p-4 p-md-5">
          <h1 class="h3 mb-2">Change Password</h1>
          <p class="text-muted mb-4">Update your account password for this retreat app.</p>

          <form id="changePasswordForm">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="currentPassword">Current password</label>
              <input id="currentPassword" type="password" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="newPassword">New password</label>
              <input id="newPassword" type="password" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="confirmPassword">Confirm new password</label>
              <input id="confirmPassword" type="password" class="form-control" required />
            </div>

            <button id="submitBtn" type="submit" class="btn btn-primary w-100 fw-semibold">Update password</button>
            <p id="status" class="small text-muted mt-2 mb-0"></p>
          </form>
        </section>
      </div>
    </main>

    <script src="assets/auth.js?v=20260218f"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function resolveApiBase() {
        const queryValue = new URLSearchParams(window.location.search).get("api");
        const base = queryValue && queryValue.trim() ? queryValue.trim() : window.location.origin;
        return base.replace(/\/+$/, "");
      }

      function apiUrl(path) {
        const base = resolveApiBase();
        return `${base}${path.startsWith("/") ? path : `/${path}`}`;
      }

      function setStatus(message, kind) {
        const status = document.getElementById("status");
        if (!status) return;
        status.textContent = message;
        status.className = kind === "error" ? "small text-danger mt-2 mb-0" : "small text-muted mt-2 mb-0";
      }

      async function parseJsonSafe(response) {
        try {
          return await response.json();
        } catch (_error) {
          return null;
        }
      }

      const form = document.getElementById("changePasswordForm");
      const submitBtn = document.getElementById("submitBtn");
      const currentPassword = document.getElementById("currentPassword");
      const newPassword = document.getElementById("newPassword");
      const confirmPassword = document.getElementById("confirmPassword");

      if (form && submitBtn && currentPassword && newPassword && confirmPassword) {
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const currentValue = currentPassword.value;
          const newValue = newPassword.value;
          const confirmValue = confirmPassword.value;

          if (newValue !== confirmValue) {
            setStatus("New password and confirmation do not match.", "error");
            return;
          }

          submitBtn.disabled = true;
          setStatus("Updating password...", "info");
          try {
            const res = await fetch(apiUrl("/api/auth/change-password"), {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                current_password: currentValue,
                new_password: newValue,
              }),
            });

            if (!res.ok) {
              const parsed = await parseJsonSafe(res);
              const detail = parsed && parsed.detail ? parsed.detail : `HTTP ${res.status}`;
              throw new Error(detail);
            }

            currentPassword.value = "";
            newPassword.value = "";
            confirmPassword.value = "";
            setStatus("Password updated.", "info");
          } catch (error) {
            const msg = error instanceof Error ? error.message : String(error);
            setStatus(msg, "error");
          } finally {
            submitBtn.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
