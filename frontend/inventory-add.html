<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting To Receive / Put Away - Blossom Foundation</title>
    <meta http-equiv="refresh" content="0; url=inventory-receiving.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #f4fbf9, #eef6ff);
        font-family: "Plus Jakarta Sans", sans-serif;
        color: #183153;
      }
      .redirect-card {
        width: min(92vw, 560px);
        border-radius: 1.1rem;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.24);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: "Instrument Serif", serif;
        font-size: 2rem;
      }
      p {
        margin: 0 0 0.9rem;
        line-height: 1.55;
      }
      a {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="redirect-card">
      <h1>Receive / Put Away</h1>
      <p>The separate putaway page has been merged into the shared intake workspace.</p>
      <p><a id="redirectLink" href="inventory-receiving.html">Open the combined receive / put away page.</a></p>
    </main>

    <script>
      (function () {
        var target = new URL("inventory-receiving.html", window.location.href);
        if (window.location.search) {
          target.search = window.location.search;
        }
        var link = document.getElementById("redirectLink");
        if (link) link.href = target.toString();
        window.location.replace(target.toString());
      })();
    </script>
  </body>
</html>
