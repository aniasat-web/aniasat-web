<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Blossom Foundation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/header-theme.css" />
    <style>
      :root {
        --bg: #faf8f5;
        --ink: #292524;
        --muted: #78716c;
        --border: #e7e5e4;
        --primary: #b45309;
        --primary-hover: #92400e;
        --surface: #fffefb;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: radial-gradient(circle at top right, #fef3c7 0%, var(--bg) 45%);
        color: var(--ink);
        min-height: 100vh;
        padding-top: 70px;
      }
      h1, .brand-title {
        font-family: "Instrument Serif", serif;
      }
      .auth-shell {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
      }
      .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(41, 37, 36, 0.08);
      }
      .btn-primary {
        background-color: var(--primary);
        border-color: var(--primary);
      }
      .btn-primary:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
      }
    </style>
    <link rel="stylesheet" href="assets/ui-theme.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img class="brand-logo" src="assets/blossom-mark.png" alt="Blossom logo" />
          <span>Blossom Foundation</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fw-semibold small text-uppercase">
            <li class="nav-item">
              <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="auth-shell">
        <div class="auth-card p-4 p-md-5">
          <h1 class="h3 mb-2">Sign In</h1>
          <p class="text-muted mb-4">Use your account to access retreat planning and kitchen tools.</p>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="loginUsername">Username</label>
              <input id="loginUsername" type="text" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="loginPassword">Password</label>
              <input id="loginPassword" type="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
            <p id="loginStatus" class="small text-muted mt-2"></p>
            <p id="bootstrapHint" class="small text-warning-emphasis d-none mt-2 mb-0"></p>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/auth.js?v=20260218e"></script>
  </body>
</html>
