<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Retreat Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
      :root {
        --bg: #faf8f5;
        --ink: #292524;
        --muted: #78716c;
        --border: #e7e5e4;
        --primary: #b45309;
        --primary-hover: #92400e;
        --surface: #fffefb;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: radial-gradient(circle at top right, #fef3c7 0%, var(--bg) 45%);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
      }
      h1, .brand-title {
        font-family: "Instrument Serif", serif;
      }
      .auth-shell {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
      }
      .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(41, 37, 36, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-weight: 700;
        color: var(--primary);
        text-decoration: none;
      }
      .brand img {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }
      .btn-primary {
        background-color: var(--primary);
        border-color: var(--primary);
      }
      .btn-primary:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <div class="auth-shell">
        <div class="auth-card p-4 p-md-5">
          <a class="brand mb-3" href="#">
            <img src="assets/blossom-mark.png" alt="Blossom logo" />
            <span class="brand-title fs-4">Retreat Ops</span>
          </a>

          <h1 class="h3 mb-2">Sign In</h1>
          <p class="text-muted mb-4">Use your account to access retreat planning and kitchen tools.</p>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="loginUsername">Username</label>
              <input id="loginUsername" type="text" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="loginPassword">Password</label>
              <input id="loginPassword" type="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
            <p id="loginStatus" class="small text-muted mt-2"></p>
            <p id="bootstrapHint" class="small text-warning-emphasis d-none mt-2 mb-0"></p>
          </form>
        </div>
      </div>
    </main>

    <script src="assets/auth.js"></script>
  </body>
</html>
